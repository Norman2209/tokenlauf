<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tokenlauf</title>
  <meta name="description" content="Interaktiver Lernpfad für Prozessautomatisierung: BPMN, DMN, FEEL, Camunda Job Worker, Java/Spring Boot, Messaging, Architektur und Requirements Engineering.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">

<body>
<div class="app">
  <header class="top">

      <svg width="34" height="28" viewBox="0 0 34 28" aria-hidden="true">

        <circle cx="9" cy="14" r="5" fill="var(--token)"/>
        <rect x="19" y="5" width="12.7" height="12.7" rx="2" transform="rotate(45 25.35 11.35)" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>

      <span class="brand-sub">Programmieren für Prozessautomatisierung</span>
    </div>
    <div class="progress" aria-live="polite">
      <span class="progress-text" id="progress-text">…</span>
      <div class="progress-bar" aria-hidden="true"><span id="progress-fill" style="width:0"></span></div>
    </div>
    <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="sidebar">Lernpfad</button>
  </header>
  <div class="shell">
    <aside id="sidebar" aria-label="Lernpfad"></aside>
    <main id="main"></main>
  </div>

<script src="js/inhalte.js"></script>
<script src="js/app.js"></script>
